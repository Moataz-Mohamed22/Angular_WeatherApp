<div class="container">
  <h2>Weather List</h2>

  <div class="row">
    <div class="col-sm-6 mb-3">
      <input type="text" class="form-control" placeholder="Enter city name" [(ngModel)]="cityName">
    </div>
    <div class="col-sm-6 mb-3">
      <button class="btn btn-primary" (click)="filterWeather()">Filter</button>

      <button class="btn btn-secondary m-2" (click)="sortWeatherList()">Sort By Temperature</button>
      <button class="btn btn-secondary m-2" (click)="sortWeatherListByCity()">Sort By city Name</button>
    </div>
  </div>
  <ul class="list-group">
    @for (city of filteredWeatherList; track city.id) {
    <button class="list-group-item btn btn-block btn-success" (click)="navigateToWeather(city.temperature)">
      {{city.city}} :{{city.temperature}}
    </button>


    }
  </ul>
</div>
